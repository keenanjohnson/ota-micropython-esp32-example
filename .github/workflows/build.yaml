on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Fetch submodules
      run: |
          # Recursive clone already fetches every nested submodule the esp32
          # port needs (mbedtls+framework, tinyusb, berkeley-db, micropython-lib).
          # Do NOT run `make submodules` here: the esp32 target invokes idf.py,
          # which only exists inside the espressif/idf container used by Build.
          git submodule update --init --recursive --depth=1

    - name: Build
      run: |
          rm -rf ./vendor/micropython/mpy-cross/build  # Workaround build failure
          docker run -t -u "$UID:$GID" -e "HOME=/app" -v "${GITHUB_WORKSPACE}:/app" -w "/app" espressif/idf:v5.5.2 make build
      shell: bash

    - name: Upload Main FW Artifacts
      uses: actions/upload-artifact@v4

      with:
        name: firmware
        path: |
          firmware
